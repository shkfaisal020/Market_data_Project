services:

  postgres:

    image: postgres:15

    container_name: postgres_db

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:

    build: ./api

    container_name: market_api

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  etl:

    build: ./etl

    container_name: market_etl

    env_file:
      - .env

    depends_on:
      - postgres
      - api

volumes:

  postgres_data: